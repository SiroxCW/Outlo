name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - website/**
  pull_request:
    paths-ignore:
      - website/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Install rpmbuild for the .rpm package
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: outlo-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 14
