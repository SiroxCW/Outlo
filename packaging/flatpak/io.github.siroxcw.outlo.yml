# Flatpak build of Outlo Mail. Flathub builds without network access, so every npm package
# comes from generated-sources.json. Create that file from the lockfile with
# flatpak-node-generator (https://github.com/flatpak/flatpak-builder-tools, folder "node"):
#   flatpak-node-generator npm package-lock.json -o packaging/flatpak/generated-sources.json
app-id: io.github.siroxcw.outlo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: outlo
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
modules:
  - name: outlo
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        XDG_CACHE_HOME: /run/build/outlo/flatpak-node/cache
        npm_config_cache: /run/build/outlo/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - npm ci
      - npm run build
      # Use the Electron that npm installed. electron-builder would download its own copy.
      - npx electron-builder --linux dir -c.electronDist=node_modules/electron/dist
      - cp -a dist/linux-unpacked /app/main
      - install -Dm755 packaging/flatpak/outlo.sh /app/bin/outlo
      - install -Dm644 packaging/flatpak/io.github.siroxcw.outlo.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/io.github.siroxcw.outlo.metainfo.xml -t /app/share/metainfo
      - install -Dm644 resources/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.siroxcw.outlo.svg
      - |
        for size in 16 24 32 48 64 128 256 512; do
          install -Dm644 resources/icons/${size}x${size}.png \
            /app/share/icons/hicolor/${size}x${size}/apps/io.github.siroxcw.outlo.png
        done
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - node_modules
          - out
          - dist
          - reference
          - docs
      - generated-sources.json
